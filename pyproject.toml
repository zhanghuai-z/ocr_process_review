[project]
name = "ocr-process"
version = "0.1.0"
description = "OCR后处理桌面软件"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
    "qt-material>=2.14",
    "paddlepaddle>=3.0.0",
    "paddleocr>=2.9.0",
    "opencv-python>=4.10.0",
    "Pillow>=10.0.0",
    "lxml>=5.0.0",
    "fpdf2>=2.8.0",
    "python-docx>=1.2.0",
    "Jinja2>=3.1.0",
    "PyMuPDF>=1.24.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]
test = [
    "pytest>=8.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.10.0",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
